<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        .form-signin {
            width: 100%;
            max-width: 330px;
            padding: 15 px;
            margin: auto;
        }
    </style>
</head>
<body class="text-center">
<main class="form-signin">
    <form th:action="@{/personal_data}" th:object="${personalData}" method="post">
        <h2 class="">Заполните данные</h2>
        <div class="form-floating">
            <input type="text" th:field="*{surname}" class="form-control" name="surname"> <br>
            <label>Введите фамилию</label>
        </div>
        <div class="form-floating">
            <input type="text" th:field="*{name}" class="form-control" name="name"> <br>
            <label >Введите имя</label>
        </div>
        <div class="form-floating">
            <input type="text" th:field="*{lastName}" class="form-control" name="lastName"> <br>
            <label >Введите отчество</label>
        </div>
        <div class="form-floating">
            <input type="text" th:field="*{classNumber}" class="form-control" name="class"> <br>
            <label  class="form-label">Введите класс</label>
        </div>
        <div>
            <select th:field="*{classLetter}" class="form-select">
                <option value="а">А</option>
                <option value="б">Б</option>
                <option value="в">В</option>
            </select>
            <label  class="form-label">Выберите букву класса</label>
        </div>
        <button type="submit" class="w-100 btn btn-log btn-primary">Сохранить личные данные</button>
    </form>
</main>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</html>
