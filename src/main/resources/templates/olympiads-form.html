<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        .form-signin {
            width: 100%;
            max-width: 330px;
            padding: 15 px;
            margin: auto;
        }
    </style>
</head>
<body class="text-center">
<main class="form-signin">
    <form th:action="@{/olympiads}" th:object="${olympiad}" method="post">
        <div class="form-check form-switch">
            <label class="form-check-label">Математика</label>
            <input class="form-check-input" th:value="'Математика'" th:field="*{olympiads}" type="checkbox">
        </div>
        <div class="form-check form-switch">
            <label class="form-check-label">Информатика</label>
            <input class="form-check-input" type="checkbox" th:value="'Информатика'" th:field="*{olympiads}">
        </div>
        <div class="form-check form-switch">
            <label class="form-check-label">Физика</label>
            <input class="form-check-input" type="checkbox" th:value="'Физика'" th:field="*{olympiads}">
        </div>
        <div class="form-check form-switch">
            <label class="form-check-label">Русский</label>
            <input class="form-check-input" type="checkbox" th:value="'Русский'" th:field="*{olympiads}">
        </div>
        <div class="form-check form-switch">
            <label class="form-check-label">Литература</label>
            <input class="form-check-input" type="checkbox" th:value="'Литература'" th:field="*{olympiads}">
        </div>
        <button type="submit" class="w-100 btn btn-log btn-primary">Сохранить мои олимпиады</button>
    </form>
</main>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</html>
